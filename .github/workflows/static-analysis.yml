name: Static Analysis

on: push

permissions: {}

jobs:
  clang-tidy:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Boost 1.86.0
        run: |
          wget -O "$HOME/boost_1_86_0.tar.bz2" https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.bz2
          tar --bzip2 -xf "$HOME/boost_1_86_0.tar.bz2" -C "$HOME"
          cd "$HOME/boost_1_86_0"
          ./bootstrap.sh --with-libraries=locale,test --prefix=.
          ./b2 toolset=gcc-15 install > /dev/null

      - name: Install clang-tidy 23
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --output /etc/apt/keyrings/llvm-snapshot.gpg.key
          echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg.key] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install clang-tidy-23

      - name: Make build directory
        run: mkdir build

      - name: Generate compilation database
        working-directory: build
        env:
          BOOST_ROOT: ~/boost_1_86_0
          CXX: g++-15
        run: cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSIGHTREAD_BUILD_TESTS=ON -DSIGHTREAD_BUILD_FUZZERS=ON ..

      - name: Run clang-tidy
        run: run-clang-tidy-23 -p=build/ -hide-progress -quiet

  clang-format:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang-format 23
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --output /etc/apt/keyrings/llvm-snapshot.gpg.key
          echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg.key] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install clang-format-23

      - name: Format
        run: |
          clang-format-23 -i include/sightread/*.hpp src/sightread/*.cpp src/sightread/detail/*.cpp src/sightread/detail/*.hpp tests/sightread/*.cpp tests/sightread/*.hpp tests/sightread/detail/*.cpp fuzzing_targets/*.cpp
          git diff --color --exit-code

  gersemi:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install gersemi
        run: pip install gersemi

      - name: Format
        run: |
          gersemi . --in-place --indent 2 --no-warn-about-unknown-commands
          git diff --color --exit-code
